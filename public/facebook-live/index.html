<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MultiLive · Facebook LIVE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050806;color:#fff;font-family:system-ui;min-height:100dvh}.stage{position:fixed;inset:0;background:#101713}video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(#0009,transparent 32%,#0001 55%,#000d)}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between}.chip,.button{border:1px solid #ffffff28;background:#101511d9;color:#fff;border-radius:24px;padding:12px 15px;font-weight:900}.live{background:#ed1c40}.panel{position:absolute;left:12px;right:12px;bottom:max(20px,env(safe-area-inset-bottom));background:#101511e8;border:1px solid #ffffff2c;border-radius:25px;padding:18px;display:grid;gap:12px}.panel h1{font-size:22px;margin:0}.panel p{color:#aeb8b1;font-size:13px;line-height:1.45;margin:0}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff2d;background:#080c09;color:#fff;font-size:16px}.button{width:100%;background:#baf473;color:#14200b;border:0}.button:disabled{opacity:.45}.stop{background:#ed1c40;color:#fff}.hidden{display:none}.status{color:#dbe3dd!important;font-weight:800}.error{color:#ff8da2!important}.back{text-decoration:none;width:45px;height:45px;display:grid;place-items:center;padding:0}.badge{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;background:#baf473;border-radius:50%}</style></head>
<body><main class="stage"><video id="camera" autoplay muted playsinline></video><div class="shade"></div><header class="top"><a class="chip back" href="/">✕</a><span class="chip badge"><i class="dot"></i><b id="topStatus">PRÉPARATION</b></span></header>
<section class="panel"><h1>Vrai direct Facebook</h1><p id="explain">Choisis ta Page. La caméra sera réellement envoyée à Facebook.</p><select id="page" class="field"><option>Chargement des Pages…</option></select><input id="title" class="field" maxlength="100" value="Mon direct MultiLive" aria-label="Titre du direct"><button id="preview" class="button">1 · ACTIVER CAMÉRA ET MICRO</button><button id="start" class="button" disabled>2 · DÉMARRER SUR FACEBOOK</button><button id="stop" class="button stop hidden">ARRÊTER LE DIRECT</button><p id="status" class="status">Connexion Facebook en cours de vérification…</p></section></main>
<script>
const camera=document.querySelector('#camera'),page=document.querySelector('#page'),title=document.querySelector('#title'),preview=document.querySelector('#preview'),start=document.querySelector('#start'),stopButton=document.querySelector('#stop'),statusEl=document.querySelector('#status'),topStatus=document.querySelector('#topStatus');let stream,recorder,ws,liveStarted=false;
function status(text,error=false){statusEl.textContent=text;statusEl.classList.toggle('error',error)}
async function loadPages(){try{const response=await fetch('/api/facebook/pages');const data=await response.json();if(!response.ok)throw new Error(data.error||'Connexion Facebook requise.');page.innerHTML='';if(!data.pages.length){page.innerHTML='<option value="">Aucune Page disponible</option>';status('Il faut une Page Facebook que tu gères, pas seulement un profil personnel.',true);return}for(const item of data.pages){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;page.append(option)}status('Page Facebook trouvée. Active maintenant la caméra.')}catch(error){page.innerHTML='<option value="">Facebook à reconnecter</option>';status(error.message,true);const link=document.createElement('a');link.className='button';link.href='/oauth/meta';link.textContent='RECONNECTER FACEBOOK';document.querySelector('.panel').append(link)}}
preview.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:1280}},audio:{echoCancellation:true,noiseSuppression:true}});camera.srcObject=stream;await camera.play();preview.textContent='✓ CAMÉRA ET MICRO ACTIFS';preview.disabled=true;start.disabled=!page.value;status('Prêt. En appuyant sur Démarrer, ce sera un vrai LIVE public sur la Page sélectionnée.')}catch(error){status('Caméra ou micro refusé : autorise-les dans les réglages Safari.',true)}};
function mimeChoice(){const choices=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'];return choices.find(type=>window.MediaRecorder&&MediaRecorder.isTypeSupported(type))||''}
start.onclick=async()=>{if(!stream||!page.value)return;start.disabled=true;status('Facebook prépare le direct…');try{const response=await fetch('/api/facebook/live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pageId:page.value,title:title.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Création du direct refusée.');const mime=mimeChoice();if(!mime)throw new Error('Ce navigateur ne sait pas encoder la caméra. Mets iOS à jour et réessaie dans Safari.');const format=mime.startsWith('video/webm')?'webm':'mp4';ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/facebook-live/socket?ticket=${encodeURIComponent(data.ticket)}&format=${format}`);ws.binaryType='arraybuffer';ws.onmessage=event=>{const message=JSON.parse(event.data);if(message.type==='ready'){recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000,audioBitsPerSecond:128000});recorder.ondataavailable=e=>{if(e.data.size&&ws.readyState===1)ws.send(e.data)};recorder.start(1000);liveStarted=true;topStatus.textContent='EN DIRECT';topStatus.parentElement.classList.add('live');start.classList.add('hidden');preview.classList.add('hidden');page.classList.add('hidden');title.classList.add('hidden');stopButton.classList.remove('hidden');status(`EN DIRECT sur ${data.page.name} · garde cette page ouverte.`)}if(message.type==='error'||message.type==='encoder-warning')status(message.message,true)};ws.onerror=()=>status('Connexion au relais interrompue.',true);ws.onclose=()=>{if(liveStarted)status('Le direct Facebook est terminé.')}}catch(error){start.disabled=false;status(error.message,true)}};
async function stopLive(){if(recorder?.state==='recording')recorder.stop();if(ws?.readyState===1)ws.send(JSON.stringify({type:'stop'}));setTimeout(()=>ws?.close(),300);stream?.getTracks().forEach(track=>track.stop());liveStarted=false;topStatus.textContent='TERMINÉ';stopButton.disabled=true;status('Direct arrêté sur Facebook. Tu peux fermer cette page.')}
stopButton.onclick=stopLive;window.addEventListener('beforeunload',()=>{if(liveStarted&&ws?.readyState===1)ws.send(JSON.stringify({type:'stop'}))});loadPages();
</script></body></html>
