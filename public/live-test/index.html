<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MultiLive · Test privé</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050806;color:#fff;font-family:system-ui;height:100dvh;overflow:hidden}.stage,video,canvas{width:100%;height:100%;object-fit:cover}.stage{position:relative;background:#101713}video,canvas{position:absolute;inset:0}canvas{display:none}.shade{position:absolute;inset:0;background:linear-gradient(#0008,transparent 30%,transparent 55%,#000b)}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.chip,.btn{border:1px solid #ffffff28;background:#101511c9;color:#fff;border-radius:24px;padding:11px 14px;font-weight:800}.live{background:#ff416c}.views{display:flex;gap:7px}.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px}.card{background:#111914e8;border:1px solid #ffffff28;border-radius:24px;padding:24px;max-width:440px;width:100%}h1{margin:0 0 10px}p{color:#b9c2bc;line-height:1.5}.code{font-size:42px;color:#baf473;font-weight:900;letter-spacing:5px}.link{word-break:break-all;font-size:12px}.comments{position:absolute;left:12px;right:78px;bottom:98px;display:flex;flex-direction:column;gap:7px}.comment{background:#101511d9;border-radius:16px;padding:9px 12px;max-width:320px}.comment b{color:#baf473;font-size:11px}.comment span{display:block;font-size:13px;margin-top:2px}.bottom{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.btn{cursor:pointer}.green{background:#baf473;color:#14200b}.red{background:#ff416c}.backgrounds{position:absolute;left:10px;right:10px;bottom:88px;background:#0b100deb;border:1px solid #ffffff2b;border-radius:20px;padding:12px;display:flex;gap:7px;overflow:auto}.backgrounds.hidden{display:none}.bg{white-space:nowrap;padding:10px 12px}.bg.on{background:#baf473;color:#14200b}.viewerForm{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px}input{flex:1;background:#111914df;color:#fff;border:1px solid #ffffff30;border-radius:20px;padding:13px}.hidden{display:none}.notice{position:absolute;top:70px;left:14px;right:14px;text-align:center;color:#dce3de;font-size:12px}</style></head>
<body><main class="stage"><video id="video" autoplay playsinline muted></video><canvas id="processed"></canvas><div class="shade"></div><div class="top"><button class="chip" onclick="location.href='/'">✕</button><span class="chip live" id="status">TEST PRIVÉ</span><span class="chip views">👁 <b id="count">0</b></span></div><div id="setup" class="center"><section class="card"><h1 id="title">Préparation du test…</h1><p id="help">Autorise la caméra et le micro.</p><div id="code" class="code"></div><p id="watch" class="link"></p><button id="copy" class="btn green hidden">Copier le lien PC</button></section></div><div id="comments" class="comments"></div><div id="backgrounds" class="backgrounds hidden"><button class="btn bg on" data-bg="none">Réel</button><button class="btn bg" data-bg="blur">Flou</button><button class="btn bg" data-bg="white">Mur blanc</button><button class="btn bg" data-bg="office">Bureau</button></div><div id="hostControls" class="bottom hidden"><button id="background" class="btn">✨ Arrière-plan</button><button id="pause" class="btn green">⏸ Pause</button><button id="mute" class="btn">🎤 Micro</button><button id="stop" class="btn red">■ Arrêter</button></div><form id="commentForm" class="viewerForm hidden"><input id="name" maxlength="30" placeholder="Ton nom"><input id="message" maxlength="180" placeholder="Écrire un commentaire…"><button class="btn green">Envoyer</button></form><p id="notice" class="notice"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script><script>
const q=new URLSearchParams(location.search),room=q.get('room'),host=!room,video=document.querySelector('#video'),canvas=document.querySelector('#processed'),ctx=canvas.getContext('2d'),setup=document.querySelector('#setup'),title=document.querySelector('#title'),help=document.querySelector('#help'),code=document.querySelector('#code'),watch=document.querySelector('#watch'),count=document.querySelector('#count'),comments=document.querySelector('#comments'),controls=document.querySelector('#hostControls'),form=document.querySelector('#commentForm'),notice=document.querySelector('#notice'),backgrounds=document.querySelector('#backgrounds');
const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/live-test/socket');let stream,outStream,pc,peers=new Map(),paused=false,bg='none',segmenter,processing=false;const office=new Image();office.crossOrigin='anonymous';office.src='https://images.pexels.com/photos/12526862/pexels-photo-12526862.jpeg?auto=compress&cs=tinysrgb&w=1280';
const send=x=>ws.readyState===1&&ws.send(JSON.stringify(x));const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function addComment(name,text){const el=document.createElement('div');el.className='comment';el.innerHTML='<b></b><span></span>';el.querySelector('b').textContent=name;el.querySelector('span').textContent=text;comments.append(el);setTimeout(()=>el.remove(),6500)}
function render(r){canvas.width=r.image.width;canvas.height=r.image.height;ctx.save();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(r.segmentationMask,0,0,canvas.width,canvas.height);ctx.globalCompositeOperation='source-in';ctx.drawImage(r.image,0,0,canvas.width,canvas.height);ctx.globalCompositeOperation='destination-over';if(bg==='white'){ctx.fillStyle='#f7f7f4';ctx.fillRect(0,0,canvas.width,canvas.height)}else if(bg==='office'&&office.complete)ctx.drawImage(office,0,0,canvas.width,canvas.height);else{ctx.filter=bg==='blur'?'blur(22px)':'none';ctx.drawImage(r.image,-20,-20,canvas.width+40,canvas.height+40);ctx.filter='none'}ctx.restore()}
async function processFrame(){if(!host||!segmenter)return;if(video.readyState>=2&&!processing){processing=true;try{await segmenter.send({image:video})}finally{processing=false}}requestAnimationFrame(processFrame)}
async function hostStart(){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720}},audio:true});video.srcObject=stream;video.muted=true;await video.play();segmenter=new SelfieSegmentation({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/'+f});segmenter.setOptions({modelSelection:1,selfieMode:true});segmenter.onResults(render);canvas.style.display='block';processFrame();const processed=canvas.captureStream(24);outStream=new MediaStream([...processed.getVideoTracks(),...stream.getAudioTracks()]);setup.classList.add('hidden');controls.classList.remove('hidden');send({type:'host'})}
function makeHostPeer(id){const p=new RTCPeerConnection(ice);peers.set(id,p);outStream.getTracks().forEach(t=>p.addTrack(t,outStream));p.onicecandidate=e=>e.candidate&&send({type:'signal',id,data:{candidate:e.candidate}});p.createOffer().then(o=>p.setLocalDescription(o).then(()=>send({type:'signal',id,data:{description:p.localDescription}})));return p}
async function viewerStart(){video.muted=false;send({type:'viewer',room});title.textContent='Connexion au direct…';help.textContent='Le direct apparaîtra dans quelques secondes.';pc=new RTCPeerConnection(ice);pc.ontrack=e=>{video.srcObject=e.streams[0];setup.classList.add('hidden');form.classList.remove('hidden')};pc.onicecandidate=e=>e.candidate&&send({type:'signal',data:{candidate:e.candidate}})}
ws.onopen=()=>host?hostStart().catch(e=>{title.textContent='Caméra refusée';help.textContent=e.message}):viewerStart();
ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='room'){code.textContent=m.code;watch.textContent='Sur le PC : multilive-oauth.onrender.com/watch';setup.classList.remove('hidden');title.textContent='Code du direct privé';help.textContent='Ouvre la page spectateur sur ton PC puis saisis ce code.';document.querySelector('#copy').classList.remove('hidden');document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(m.watchUrl)}if(m.type==='viewers')count.textContent=m.count;if(m.type==='viewer-joined')makeHostPeer(m.id);if(m.type==='viewer-left'){peers.get(m.id)?.close();peers.delete(m.id)}if(m.type==='comment')addComment(m.name,m.text);if(m.type==='signal'){const p=host?peers.get(m.id):pc;if(!p)return;if(m.data.description){await p.setRemoteDescription(m.data.description);if(!host){const a=await p.createAnswer();await p.setLocalDescription(a);send({type:'signal',data:{description:p.localDescription}})}}if(m.data.candidate)await p.addIceCandidate(m.data.candidate)}if(m.type==='error'){title.textContent='Direct indisponible';help.textContent=m.message}if(m.type==='ended'){notice.textContent='Le direct est terminé.';video.srcObject=null;form.classList.add('hidden')}};
document.querySelector('#background').onclick=()=>backgrounds.classList.toggle('hidden');document.querySelectorAll('.bg').forEach(b=>b.onclick=()=>{bg=b.dataset.bg;document.querySelectorAll('.bg').forEach(x=>x.classList.toggle('on',x===b));backgrounds.classList.add('hidden')});
document.querySelector('#pause').onclick=()=>{paused=!paused;outStream.getTracks().forEach(t=>t.enabled=!paused);document.querySelector('#pause').textContent=paused?'▶ Reprendre':'⏸ Pause';document.querySelector('#status').textContent=paused?'EN PAUSE':'TEST PRIVÉ'};
document.querySelector('#mute').onclick=()=>{const t=stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;document.querySelector('#mute').textContent=t.enabled?'🎤 Micro':'🔇 Muet'}};document.querySelector('#stop').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());ws.close();location.href='/'};
form.onsubmit=e=>{e.preventDefault();const text=document.querySelector('#message');if(text.value.trim()){send({type:'comment',name:document.querySelector('#name').value||'Spectateur',text:text.value});text.value=''}};
</script></body></html>
