<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voir MultiLive</title><style>body{margin:0;background:#07100a;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(440px,90vw);background:#121b15;border:1px solid #354338;border-radius:25px;padding:28px;text-align:center}h1{font-size:32px}p{color:#9eaaa1}input{width:100%;box-sizing:border-box;padding:16px;text-align:center;text-transform:uppercase;font-size:25px;letter-spacing:5px;border-radius:15px;border:1px solid #4d5d50;background:#080d09;color:#baf473}button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:15px;background:#baf473;color:#14200b;font-weight:900}</style></head><body><form class="box"><h1>Voir un test MultiLive</h1><p>Saisis le code affiché sur l’iPhone.</p><input maxlength="6" required autofocus placeholder="CODE"><button>REGARDER LE DIRECT</button></form><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const code=document.querySelector('input').value.trim().toUpperCase();if(code)location.href='/live-test/?room='+encodeURIComponent(code)}</script></body></html>
